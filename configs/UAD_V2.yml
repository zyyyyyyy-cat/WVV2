MODEL:
  PRETRAIN_CHOICE: 'none'
  METRIC_LOSS_TYPE: 'wrt'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  TRANSFORMER_TYPE: 'vit_base_in'
  STRIDE_SIZE: [16, 16]
  SIE_CAMERA: False
  SIE_VIEW: False
  PCA_LOSS_WEIGHT: 0.01
  GPD_MOMENTUM: 0.2
  VISA_ADAPT:
    MODE: 'full'
    UAD_CHECKPOINT: '/project/code/WHU_base/WHU_DDP/logs/UAD_1000_DDP/transformer_120.pth'
    RESUME_CHECKPOINT: ''
    EXPERTS: 4
    TOP_K: 2
    PROMPT_LEN: 8
    HEADS: 12
    GRAPH_K: 40
    FUSION_BETA: 0.5
    SPECIFIC_WRT_WEIGHT: 0.05
    LOCAL_CE_WEIGHT: 0.05
    LOCAL_CM_WEIGHT: 0.10
    FUSION_WRT_WEIGHT: 0.30
    BALANCE_WEIGHT: 0.0001
    LOSS_RAMP_EPOCHS: 10
    NEW_LR_FACTOR: 16.0
INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]
DATASETS:
  NAMES: 'WHU-MARS'
  ROOT_DIR: '/project/code/data'
  MODALITIES: ['RGB', 'IR', 'Thermal']
DATALOADER:
  SAMPLER: 'PKM'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8
SOLVER:
  OPTIMIZER_NAME: 'SGD'
  MAX_EPOCHS: 60
  BASE_LR: 0.0005
  IMS_PER_BATCH: 256
  SEED: 1234
  WARMUP_EPOCHS: 5
  CHECKPOINT_PERIOD: 10
  EVAL_PERIOD: 10
  WEIGHT_DECAY: 0.0001
  WEIGHT_DECAY_BIAS: 0.0001
  BIAS_LR_FACTOR: 2
  LOSS_TYPE: 'base+pca+gpd'
TEST:
  IMS_PER_BATCH: 32
  RE_RANKING: False
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'
  TOP_K_EVAL: 0
  DETAILED_DOMAIN_EVAL: True
OUTPUT_DIR: './logs/UAD_V2'
